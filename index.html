<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shakara — Ankara Edit</title>
<meta property="og:title" content="Shakara — Ankara Edit">
<meta property="og:description" content="Style with infinite Ankara possibility. Découvrez la sélection Shakara.">
<meta property="og:image" content="/images/hero.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#312e2d">
<style>
  :root{--ink:#312e2d;--paper:#ffffff;--muted:#6b6560;--pill-grey:#bfb6b1;--line:rgba(49,46,45,0.12);color-scheme:light;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#f1ede9;--paper:#151312;--muted:#a89f97;--pill-grey:#5b544d;--line:rgba(241,237,233,0.14);color-scheme:dark;}}
  :root[data-theme="dark"]{--ink:#f1ede9;--paper:#151312;--muted:#a89f97;--pill-grey:#5b544d;--line:rgba(241,237,233,0.14);color-scheme:dark;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;}
  .page{width:100%;max-width:520px;min-height:100vh;background:var(--paper);}
  .hero{display:block;}
  .hero img{display:block;width:100%;height:auto;}
  .nav{padding:24px 24px 8px;text-align:center;}
  .nav div{font-size:16px;letter-spacing:-0.02em;line-height:2;}
  .nav a{color:inherit;text-decoration:none;}
  .tagline{padding:16px 24px 0;text-align:center;}
  .tagline .lead{font-family:'Times New Roman',Times,serif;font-style:italic;font-size:28px;letter-spacing:-0.02em;line-height:1.4;margin:0 0 16px;}
  .tagline .sub{font-size:16px;line-height:1.4;margin:0 0 16px;color:var(--ink);}
  .product{padding:0 24px 16px;}
  .product img{display:block;width:100%;height:auto;margin-bottom:16px;}
  .product .name{font-size:16px;font-weight:700;line-height:1.4;margin:0 0 16px;}
  .product .price{font-size:16px;line-height:1.4;margin:0 0 16px;}
  .pill{display:inline-flex;align-items:center;justify-content:center;border-radius:101px;text-decoration:none;font-family:Arial,Helvetica,sans-serif;}
  .pill-cart{background:var(--pill-grey);color:#000000;width:141px;height:32px;font-size:14px;letter-spacing:0.02em;}
  .banner{display:block;}
  .banner img{display:block;width:100%;height:auto;}
  .offer{padding:16px 24px 40px;text-align:center;}
  .offer .lead{font-family:'Times New Roman',Times,serif;font-style:italic;font-size:28px;letter-spacing:-0.02em;line-height:1.4;margin:0 0 16px;}
  .pill-shop{background:var(--ink);color:var(--paper);width:183px;height:51px;font-size:18.9px;letter-spacing:0.02em;}
</style>
</head>
<body>
<div class="page">
  <a class="hero" href="https://shakara.africa/">
    <img src="images/hero.jpg" alt="Shakara">
  </a>
  <div class="nav">
    <div><a href="https://shakara.africa/products?tag=women">WOMEN</a></div>
    <div><a href="https://shakara.africa/products?tag=men">MEN</a></div>
    <div><a href="https://shakara.africa/products?tag=beauty">BEAUTY</a></div>
    <div><a href="https://shakara.africa/products?tag=fabrics">FABRICS</a></div>
    <div><a href="https://shakara.africa/products?tag=home-decor">HOME DECOR</a></div>
  </div>
  <div class="tagline">
    <p class="lead">Actual promo pieces,</p>
    <p class="sub">Style with infinite Ankara possibility,</p>
  </div>
  <div class="product">
    <img src="images/dress.jpg" alt="Brown Maxi Dress">
    <p class="name">Brown Maxi Dress</p>
    <p class="price">₵508</p>
    <a class="pill pill-cart" href="https://shakara.africa/product/brown-maxi-dress">ADD TO CART</a>
  </div>
  <div class="product">
    <img src="images/bag.jpg" alt="Red Tassel Beaded Bag">
    <p class="name">Red Tassel Beaded Bag</p>
    <p class="price">₵384</p>
    <a class="pill pill-cart" href="https://shakara.africa/product/stylish-african-glass-metallic-serving-tray-copy-copy-copy-copy">ADD TO CART</a>
  </div>
  <div class="product">
    <img src="images/shirt.jpg" alt="Navy Gold Short Sleeve Shirt">
    <p class="name">Navy Gold Short Sleeve Shirt</p>
    <p class="price">₵376</p>
    <a class="pill pill-cart" href="https://shakara.africa/product/navy-gold-short-sleeve-shirt">ADD TO CART</a>
  </div>
  <a class="banner" href="https://shakara.africa/">
    <img src="images/mockup.gif" alt="Shakara sur mobile">
  </a>
  <div class="offer">
    <p class="lead">Get more exclusive deals</p>
    <a class="pill pill-shop" href="https://shakara.africa/">SHOP NOW</a>
  </div>
</div>
</body>
</html>
